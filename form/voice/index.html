<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; object-src 'none'">
  <meta name="theme-color" content="#173f70">
  <title>音声入力｜CDP北海道</title>
  <link rel="stylesheet" href="helper.css">
  <script defer src="voice-channel.js"></script>
  <script defer src="helper.js"></script>
</head>
<body>
  <main class="voice-shell">
    <header class="voice-header">
      <h1>音声入力</h1>
      <button id="voiceClose" class="button secondary" type="button">閉じる</button>
    </header>
    <div class="voice-body">
      <p id="voiceStatus" class="status" role="status" aria-live="polite">フォームに接続中…</p>
      <div class="voice-controls">
        <button id="voiceStart" class="button primary" type="button" disabled>話し始める</button>
        <button id="voiceStop" class="button stop" type="button" disabled>話し終える</button>
      </div>
      <label for="voiceTranscript">文字起こし</label>
      <textarea id="voiceTranscript" rows="9" maxlength="10000" readonly></textarea>
      <button id="voiceReturn" class="button primary return-button" type="button" disabled>フォームへ戻す</button>
    </div>
  </main>
</body>
</html>
