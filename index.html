<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CDP北海道｜顧客・案件・営業管理システム Ver1.0 実行版（R0 画面試作）</title>
<!--
  CDP北海道 顧客・案件・営業管理システム Ver1.0 実行版
  区分 : R0 画面試作（AI開発指示書 Ver1.0 第6.1章）
  目的 : 画面イメージと操作順の合意。実データ保存・通知・外部送信は行わない。
  正本 : docs/REQUIREMENTS.md 等が未作成のため、本ファイル内の REG（表示ラベル・状態・
         エラーコード）は「仮決定」であり、正本確定後は正本参照へ差し替える。
  禁止 : 本ファイルのサンプル値（社名・金額・件数）を正式データや計算条件へ流用しない。
-->
<style>
/* ===== Ui_StyleTokens 相当（色・寸法の正本を1か所へ） ===== */
:root{
  --navy:#14375f; --navy-2:#1d4d80; --blue:#1f6fb8; --blue-weak:#e9f2fb;
  --green:#2f7a63; --green-weak:#e3f2ec; --gold:#9a6f10; --gold-weak:#fdf2d6;
  --red:#a81f2b; --red-weak:#fdecec; --ink:#1f2d3d; --ink-2:#42556b; --muted:#66788c;
  --line:#d8e2ec; --line-2:#eaf0f6; --bg:#f2f6fa; --white:#fff; --focus:#0b63c5;
  --r0:#6b7a8d; --r1:#1f6fb8; --r2:#2f7a63; --r3:#9a6f10;
  --shadow:0 6px 18px rgba(20,55,95,.08);
  --tap:44px; --radius:12px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink); line-height:1.6;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Kaku Gothic ProN","Noto Sans JP",Meiryo,sans-serif;
  font-size:14px; -webkit-text-size-adjust:100%;
}
/* 17.2 禁止: word-break:break-all の全体適用。長文のみ自然折返し */
p,li,td,dd{overflow-wrap:anywhere; word-break:normal}
h1,h2,h3,h4,th,label,.badge,.num,.chip{word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--focus); outline-offset:2px; border-radius:4px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* ===== レイアウト ===== */
.shell{display:grid; grid-template-columns:minmax(224px,252px) minmax(0,1fr); min-height:100vh}
.side{background:var(--navy); color:#eaf2f9; display:flex; flex-direction:column; gap:14px; padding:18px 12px; min-width:0}
.brand{padding:0 8px}
.brand b{display:block; font-size:17px; letter-spacing:.02em}
.brand span{display:block; font-size:11px; color:#a9c8e4; margin-top:2px}
.side .stage{margin:0 8px; background:#0f2b4b; border:1px solid #2b5480; border-radius:10px; padding:9px 10px; font-size:11px; color:#cfe2f3; line-height:1.7}
.nav{display:flex; flex-direction:column; gap:3px; min-width:0}
.nav-group{margin-top:10px; padding:8px 10px 2px; font-size:10px; letter-spacing:.08em; color:#8fb4d6; border-top:1px solid #2b5480}
.nav button{
  display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%;
  min-height:var(--tap); border:0; background:transparent; color:#dceaf6; text-align:left;
  border-radius:9px; padding:8px 10px; font-size:13px;
}
.nav button:hover{background:#1d4472}
.nav button[aria-current="page"]{background:var(--blue); color:#fff; font-weight:700}
.side-note{margin-top:auto; padding:10px; font-size:11px; line-height:1.7; color:#b9d2e8}
.main{min-width:0; display:flex; flex-direction:column}

/* ===== トップバー（役割・画面状態の切替 = 試作用デモ操作） ===== */
.top{background:var(--white); border-bottom:1px solid var(--line); padding:12px 20px; display:flex; flex-wrap:wrap; gap:12px 16px; align-items:center; justify-content:space-between}
.top h1{margin:0; font-size:17px}
.top .top-meta{font-size:11px; color:var(--muted); margin-top:2px}
.ctrls{display:flex; flex-wrap:wrap; gap:8px 10px; align-items:flex-end}
.ctrl{display:flex; flex-direction:column; gap:3px}
.ctrl label{font-size:10px; color:var(--muted); font-weight:700}
.ctrl select{min-height:36px; border:1px solid var(--line); border-radius:8px; padding:4px 8px; background:var(--white); font-size:12px; max-width:220px}
.vp{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:99px; padding:6px 10px; font-size:11px; color:var(--ink-2); background:var(--line-2); white-space:nowrap}
.content{padding:20px; max-width:1420px; width:100%; margin:0 auto}

/* ===== 見出し・共通部品 ===== */
.page-head{display:flex; flex-wrap:wrap; gap:12px; justify-content:space-between; align-items:flex-start; margin-bottom:14px}
.page-head h2{margin:0 0 4px; font-size:23px; line-height:1.35}
.page-head p{margin:0; color:var(--ink-2); font-size:13px; max-width:70ch}
.head-actions{display:flex; flex-wrap:wrap; gap:8px}
.card{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px}
#view > .card,#view > .cols,#view > .cols-side,#view > .note,#view > .kpis{margin-bottom:14px}
#view > *:last-child{margin-bottom:0}
.card h3{margin:0 0 4px; font-size:15px}
.card .card-desc{margin:0 0 12px; font-size:12px; color:var(--muted)}
.card-top{display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between; align-items:center; margin-bottom:10px}
.cols{display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.cols-side{display:grid; gap:14px; grid-template-columns:minmax(0,1.6fr) minmax(280px,.8fr)}
.stack{display:grid; gap:12px}
.stack-sm{display:grid; gap:8px}
.kpis{display:grid; gap:10px; grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}
.kpi{background:var(--white); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px}
.kpi .kpi-label{display:block; font-size:11px; color:var(--muted)}
.kpi .num{display:block; font-size:22px; margin:2px 0 3px}
.kpi .kpi-sub{display:block; font-size:11px; color:var(--ink-2)}
.num{white-space:nowrap; font-variant-numeric:tabular-nums; font-weight:700} /* 17.2 数値と単位は同一インライン要素 */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:38px; border:1px solid var(--line); background:var(--white); color:var(--ink); border-radius:9px; padding:6px 13px; font-size:12px; font-weight:700; white-space:nowrap}
.btn:hover{border-color:#b9cade; background:#f7fafd}
.btn.primary{background:var(--blue); border-color:var(--blue); color:#fff}
.btn.primary:hover{background:#1a5f9f}
.btn.green{background:var(--green); border-color:var(--green); color:#fff}
.btn.danger{background:var(--white); border-color:#e0b4b8; color:var(--red)}
.btn.sm{min-height:32px; padding:4px 10px; font-size:11px}
.btn[disabled]{opacity:.55; cursor:not-allowed}
.btn .spin{width:12px;height:12px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.chip{display:inline-flex; align-items:center; gap:4px; border-radius:99px; padding:2px 8px; font-size:10px; font-weight:700; border:1px solid transparent; white-space:nowrap}
.chip.r0{background:#eef1f5; color:var(--r0); border-color:#d5dbe3}
.chip.r1{background:var(--blue-weak); color:var(--r1); border-color:#c3ddf3}
.chip.r2{background:var(--green-weak); color:var(--r2); border-color:#bfe0d3}
.chip.r3{background:var(--gold-weak); color:var(--gold); border-color:#ecd39a}
.badge{display:inline-flex; align-items:center; gap:4px; border-radius:7px; padding:3px 8px; font-size:11px; font-weight:700; border:1px solid transparent; white-space:nowrap}
.badge .ic{font-size:11px; line-height:1; flex:0 0 auto}
/* 長い注意文言は意味のまとまりで折り返す（短いラベルは nowrap のまま） */
.badge.wrap{white-space:normal; text-align:left; align-items:flex-start}
.badge.info{background:var(--blue-weak); color:#14538c; border-color:#c3ddf3}
.badge.ok{background:var(--green-weak); color:#1f6552; border-color:#bfe0d3}
.badge.warn{background:var(--gold-weak); color:#7a5708; border-color:#ecd39a}
.badge.danger{background:var(--red-weak); color:var(--red); border-color:#eebfc3}
.badge.muted{background:#eef2f6; color:#4d5f73; border-color:#dbe3ec}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:11px; color:var(--ink-2); background:#f4f7fa; border:1px solid var(--line-2); border-radius:5px; padding:1px 5px; white-space:nowrap}
.note{border:1px solid var(--line); background:#f7fafd; border-radius:10px; padding:11px 12px; font-size:12px; color:var(--ink-2)}
.note.warn{background:var(--gold-weak); border-color:#ecd39a; color:#6d4e07}
.note.danger{background:var(--red-weak); border-color:#eebfc3; color:#8a1b25}
.note.info{background:var(--blue-weak); border-color:#c3ddf3; color:#14538c}
.note b{display:block; margin-bottom:3px}
.kv{display:grid; grid-template-columns:minmax(88px,30%) 1fr; gap:6px 10px; font-size:12px; margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.bullets{margin:0; padding-left:18px; font-size:12px; display:grid; gap:5px}
.divider{height:1px; background:var(--line-2); margin:12px 0}

/* ===== 一覧（PC=表 / 〜760px=カード） 17.2 ===== */
.table-wrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table.tbl{width:100%; border-collapse:collapse; font-size:12px; min-width:560px}
table.tbl th,table.tbl td{padding:9px 10px; border-bottom:1px solid var(--line-2); text-align:left; vertical-align:top; white-space:nowrap}
table.tbl th{background:#f6f9fc; color:var(--muted); font-size:10px; letter-spacing:.04em; border-bottom:1px solid var(--line)}
table.tbl td.wrap,table.tbl th.wrap{white-space:normal; min-width:170px}
table.tbl tr:last-child td{border-bottom:0}
@media(max-width:760px){
  table.tbl{min-width:0}
  table.tbl thead{display:none}
  table.tbl tbody,table.tbl tr,table.tbl td{display:block; width:100%}
  table.tbl tr{border:1px solid var(--line); border-radius:10px; padding:6px 8px; margin-bottom:10px; background:var(--white)}
  table.tbl td{display:grid; grid-template-columns:minmax(84px,34%) 1fr; gap:8px; padding:6px 2px; border-bottom:1px solid var(--line-2); white-space:normal}
  table.tbl td:last-child{border-bottom:0}
  table.tbl td::before{content:attr(data-label); font-size:10px; font-weight:700; color:var(--muted)}
}

/* ===== 業務カード ===== */
.item{border:1px solid var(--line); border-left:4px solid var(--blue); border-radius:10px; padding:11px 12px; background:var(--white)}
.item.warn{border-left-color:var(--gold)}
.item.ok{border-left-color:var(--green)}
.item.danger{border-left-color:var(--red)}
.item-top{display:flex; flex-wrap:wrap; gap:6px; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted)}
.item h4{margin:6px 0 4px; font-size:14px; line-height:1.45}
.item p{margin:0 0 8px; font-size:12px; color:var(--ink-2)}
.item-foot{border-top:1px solid var(--line-2); padding-top:8px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; font-size:11px; color:var(--muted)}
.item-foot .actions{display:flex; gap:6px; flex-wrap:wrap}

/* ===== 14段階フロー ===== */
.steps{display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.step{border:1px solid var(--line); border-radius:10px; padding:9px 10px; background:var(--white)}
.step b{display:block; font-size:10px; color:var(--blue)}
.step span{display:block; font-size:12px; font-weight:700; margin:2px 0}
.step small{font-size:10px; color:var(--muted)}

/* ===== フォーム 17.3 ===== */
.form{display:grid; gap:12px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.field{display:flex; flex-direction:column; gap:4px; min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:11px; font-weight:700; color:var(--ink-2); display:flex; gap:6px; align-items:center; flex-wrap:wrap}
.field .hint{font-size:10px; color:var(--muted); font-weight:400}
.field input,.field select,.field textarea{width:100%; min-height:var(--tap); border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--white); font-size:13px}
.field textarea{min-height:96px; resize:vertical; line-height:1.6}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--focus)}
.field .err{font-size:11px; color:var(--red); font-weight:700; display:none; align-items:center; gap:4px}
.field.invalid input,.field.invalid select,.field.invalid textarea{border-color:var(--red); background:#fffafa}
.field.invalid .err{display:flex}
.req{color:var(--red); font-size:10px; border:1px solid #eebfc3; background:var(--red-weak); border-radius:4px; padding:0 4px}

/* ===== 画面状態（17.1） ===== */
.state-box{border:1px dashed var(--line); border-radius:var(--radius); padding:26px 18px; text-align:center; background:var(--white)}
.state-box .ic{font-size:26px; line-height:1; display:block; margin-bottom:8px}
.state-box h3{margin:0 0 6px; font-size:16px}
.state-box p{margin:0 auto 12px; font-size:12px; color:var(--ink-2); max-width:56ch}
.state-box .state-actions{display:flex; gap:8px; justify-content:center; flex-wrap:wrap}
.state-box.err{border-style:solid; border-color:#eebfc3; background:#fffbfb}
.state-box.warn{border-style:solid; border-color:#ecd39a; background:#fffdf7}
.skel{display:grid; gap:8px}
.skel i{display:block; height:13px; border-radius:6px; background:linear-gradient(90deg,#eef2f7,#e2e9f1,#eef2f7); background-size:200% 100%; animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}

/* ===== モーダル ===== */
.overlay{position:fixed; inset:0; background:rgba(16,36,60,.5); display:flex; align-items:flex-start; justify-content:center; padding:24px 14px; overflow:auto; z-index:40}
.overlay[hidden]{display:none}
.modal{background:var(--white); border-radius:14px; width:min(760px,100%); box-shadow:0 20px 50px rgba(10,30,55,.3); overflow:hidden}
.modal header{display:flex; gap:10px; justify-content:space-between; align-items:flex-start; padding:14px 16px; border-bottom:1px solid var(--line)}
.modal header h3{margin:0; font-size:16px}
.modal .body{padding:16px; display:grid; gap:12px}
.modal footer{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; flex-wrap:wrap; background:#fafcfe}
.x{border:0; background:transparent; font-size:20px; line-height:1; color:var(--muted); min-height:var(--tap); min-width:36px}

/* ===== トースト ===== */
.toast-wrap{position:fixed; right:16px; bottom:16px; display:grid; gap:8px; z-index:60; max-width:min(360px,calc(100vw - 32px))}
.toast{background:#12293f; color:#fff; border-radius:10px; padding:10px 13px; font-size:12px; box-shadow:0 10px 24px rgba(10,30,55,.28); display:flex; gap:8px; align-items:flex-start}
.toast.err{background:#7d1a24}
.toast.ok{background:#1c5f4c}

/* ===== レスポンシブ（360/390/768/1280 で確認） ===== */
@media(max-width:960px){
  .shell{grid-template-columns:1fr}
  .side{position:sticky; top:0; z-index:30; padding:10px 10px 8px; gap:8px}
  .side-note,.side .stage{display:none}
  .brand{display:flex; align-items:baseline; gap:8px; padding:0 4px}
  .brand span{margin:0}
  .nav{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:2px}
  .nav-group{display:none}
  .nav button{width:auto; flex:0 0 auto; padding:7px 12px; font-size:12px; background:#1d4472}
  .cols-side{grid-template-columns:1fr}
  .content{padding:14px}
}
@media(max-width:600px){
  body{font-size:13px}
  .btn{min-height:var(--tap)}
  .top{padding:10px 12px}
  .top h1{font-size:15px}
  .page-head h2{font-size:19px}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
  .kpi .num{font-size:19px}
  .kv{grid-template-columns:1fr; gap:2px 0}
  .kv dd{margin-bottom:6px}
}
@media print{ .side,.top .ctrls,.toast-wrap{display:none} }
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="brand"><b>CDP北海道</b><span>顧客・案件・営業管理システム</span></div>
    <p class="stage">R0 画面試作／サンプルデータ<br>実データの保存・通知・外部送信は行いません。</p>
    <nav class="nav" id="nav" aria-label="システムメニュー"></nav>
    <p class="side-note">AI開発指示書 Ver1.0 準拠の試作です。金額・社名・件数はすべてサンプルであり、正式データや計算条件へ流用できません。</p>
  </aside>
  <main class="main">
    <header class="top">
      <div>
        <h1 id="page-title">全体ダッシュボード</h1>
        <div class="top-meta" id="page-meta"></div>
      </div>
      <div class="ctrls">
        <div class="ctrl">
          <label for="role-select">操作役割（権限デモ）</label>
          <select id="role-select"></select>
        </div>
        <div class="ctrl">
          <label for="state-select">画面状態（17.1 デモ）</label>
          <select id="state-select"></select>
        </div>
        <span class="vp" id="vp-badge">幅 -</span>
      </div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast-wrap" id="toasts" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =====================================================================
 * 1. REG : 表示ラベル・状態・エラーコードの唯一の正本（9.5 / 13.1）
 *    画面側でラベルや条件を二重定義しない。
 * ===================================================================== */
var REG = {
  release: {
    R0:{label:"R0 画面試作", cls:"r0"},
    R1:{label:"R1 業務MVP",  cls:"r1"},
    R2:{label:"R2 営業・分析",cls:"r2"},
    R3:{label:"R3 AI支援",   cls:"r3"}
  },
  /* 3.3 事実・仮決定・サンプル・未確認の区分 */
  confidence: {
    CONFIRMED:{label:"確認済み", tone:"ok",    ic:"✔"},
    TENTATIVE:{label:"仮決定",   tone:"info",  ic:"△"},
    SAMPLE:   {label:"サンプル", tone:"muted", ic:"◇"},
    UNCONFIRMED:{label:"未確認", tone:"danger",ic:"⚠"}
  },
  /* 2.2 役割コード（人名をコードへ書かない） */
  roles: {
    EMPLOYEE:    {label:"社員（EMPLOYEE）",           note:"案件受付の登録と自己タスク確認"},
    SALES_MEMBER:{label:"推進部担当（SALES_MEMBER）", note:"内容確認・活動・提案・見積・次回行動"},
    SALES_MANAGER:{label:"推進部責任者（SALES_MANAGER）",note:"案件方針・案件承認・チーム設定"},
    EXECUTIVE:   {label:"経営（EXECUTIVE）",          note:"経営判断・顧客化承認"},
    SYSTEM_ADMIN:{label:"システム管理（SYSTEM_ADMIN）",note:"環境・マスタ・障害対応（業務承認権限なし）"},
    AUDITOR:     {label:"監査（AUDITOR）",            note:"監査ログ・承認履歴の参照のみ"}
  },
  /* 8.1 状態機械は分離する。コードと表示名も分離する */
  intakeStatus: {
    DRAFT:{label:"下書き",tone:"muted"}, SUBMITTED:{label:"受付済み",tone:"info"},
    UNDER_REVIEW:{label:"内容確認中",tone:"info"}, INFO_REQUIRED:{label:"情報不足",tone:"warn"},
    PENDING_APPROVAL:{label:"承認待ち",tone:"warn"}, APPROVED:{label:"承認済み",tone:"ok"},
    NOT_A_CASE:{label:"非案件",tone:"muted"}, ON_HOLD:{label:"保留",tone:"muted"},
    CANCELLED:{label:"取消",tone:"muted"}
  },
  caseStatus: {
    INITIAL_CONTACT:{label:"初回接触",tone:"muted"}, APPOINTMENT_WAIT:{label:"アポ待ち",tone:"muted"},
    APPOINTMENT_SET:{label:"アポ確定",tone:"info"}, NEGOTIATION:{label:"商談",tone:"info"},
    PROPOSAL:{label:"提案",tone:"info"}, QUOTATION:{label:"見積",tone:"info"},
    CUSTOMER_REVIEW:{label:"客先検討",tone:"warn"}, WON:{label:"受注",tone:"ok"},

    Api._log(req, "OK", trace);
    return {ok:true, data:data, meta:meta};
  },
  _fail:function(code, meta){
    var def = REG.errors[code];
    return {ok:false, error:{code:code, message:def.message, retryable:def.retryable, fieldErrors:{}}, meta:meta};
  },
  _log:function(req, result, trace){
    /* 15.2 ログには相談本文・氏名・連絡先を書かない（最小情報のみ） */
    DB.operationLog.unshift({at:nowStamp(), requestId:req.requestId, action:req.action,
      actorRole:APP.role, entityId:req.entityId || "—", result:result, traceId:trace});
    DB.auditLog.unshift({at:nowStamp(), actorRole:APP.role, action:req.action,
      entityId:req.entityId || "—", result:result.indexOf("NG") === 0 ? "NG" : "OK", traceId:trace});
  }
};

/* =====================================================================
 * 6. UI ヘルパ（13.2 利用者入力は textContent。innerHTML を使わない）
 * ===================================================================== */
function h(tag, props){
  var e = document.createElement(tag), i, k, v;
  if(props){
    for(k in props){
      if(!Object.prototype.hasOwnProperty.call(props,k)) continue;
      v = props[k];
      if(v === null || v === undefined || v === false) continue;
      if(k === "class") e.className = v;
      else if(k === "text") e.textContent = v;
      else if(k.indexOf("on") === 0 && typeof v === "function") e.addEventListener(k.slice(2).toLowerCase(), v);
      else if(k === "dataset"){ for(var d in v){ e.dataset[d] = v[d]; } }
      else e.setAttribute(k, v === true ? "" : v);
    }
  }
  for(i = 2; i < arguments.length; i++) append(e, arguments[i]);
  return e;
}
function append(parent, kid){
  if(kid === null || kid === undefined || kid === false) return;
  if(Array.isArray(kid)){ kid.forEach(function(k){ append(parent, k); }); return; }
  parent.appendChild(kid.nodeType ? kid : document.createTextNode(String(kid)));
}
function clear(node){ while(node.firstChild) node.removeChild(node.firstChild); }
function fmtMoney(v){
  if(v === null || v === undefined) return null;
  return (v / 10000).toLocaleString("ja-JP") + "万円";
}
/* 17.2 数値と単位は同じインライン要素へ入れる */
function num(text){ return h("span", {class:"num", text:text}); }
function badge(text, tone, icon){
  return h("span", {class:"badge " + (tone || "muted")}, icon ? h("span",{class:"ic","aria-hidden":"true",text:icon}) : null, text);
}
function statusBadge(machine, code){
  var def = (REG[machine] || {})[code];
  if(!def) return badge(code, "muted");
  return badge(def.label, def.tone);
}
function confidenceBadge(code){
  var def = REG.confidence[code] || REG.confidence.UNCONFIRMED;
  return badge(def.label, def.tone, def.ic);
}
/* 4.1 未確認は色だけで伝えず、アイコン＋文言を必ず添える */
function unconfirmedFlag(detail){
  return h("span", {class:"badge danger wrap"}, h("span",{class:"ic","aria-hidden":"true",text:"⚠"}),
    UNCONFIRMED_TEXT + (detail ? "：" + detail : ""));
}
function releaseChip(r){
  var def = REG.release[r];
  return h("span", {class:"chip " + def.cls, title:"リリース区分"}, def.label);
}
function card(title, desc){
  var c = h("div", {class:"card"});
  if(title) c.appendChild(h("h3", {text:title}));
  if(desc) c.appendChild(h("p", {class:"card-desc", text:desc}));
  for(var i = 2; i < arguments.length; i++) append(c, arguments[i]);
  return c;
}
function kpi(label, value, sub, tone){
  return h("div", {class:"kpi"},
    h("span", {class:"kpi-label", text:label}),
    num(value),
    sub ? h("span", {class:"kpi-sub"}, sub) : null);
}
/* 表：PCは表、760px以下はカード化（td の data-label を使う） */
function table(cols, rows){
  var thead = h("tr");
  cols.forEach(function(c){ thead.appendChild(h("th", {class:c.wrap ? "wrap" : null, text:c.label})); });
  var tbody = h("tbody");
  rows.forEach(function(r){
    var tr = h("tr");
    cols.forEach(function(c, i){
      var td = h("td", {class:c.wrap ? "wrap" : null, "data-label":c.label});
      append(td, r[i]);
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });
  return h("div", {class:"table-wrap"}, h("table", {class:"tbl"}, h("thead", null, thead), tbody));
}
function toast(text, kind){
  var box = document.getElementById("toasts");
  var t = h("div", {class:"toast " + (kind || "")}, h("span",{"aria-hidden":"true",text:kind === "err" ? "⚠" : kind === "ok" ? "✔" : "ℹ"}), h("span",{text:text}));
  box.appendChild(t);
  setTimeout(function(){ if(t.parentNode) t.parentNode.removeChild(t); }, 4200);
}
function openModal(title, bodyNodes, footNodes){
  var ov = document.getElementById("overlay");
  clear(ov);
  var m = h("div", {class:"modal", role:"dialog","aria-modal":"true","aria-label":title},
    h("header", null, h("h3", {text:title}), h("button", {class:"x", "aria-label":"閉じる", onclick:closeModal, text:"×"})),
    h("div", {class:"body"}, bodyNodes),
    footNodes ? h("footer", null, footNodes) : null);
  ov.appendChild(m);
  ov.hidden = false;
  var first = m.querySelector("button,select,input,textarea");
  if(first) first.focus();
}
function closeModal(){
  var ov = document.getElementById("overlay");
  ov.hidden = true;
  clear(ov);
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

/* 保存中はボタンを無効化して連打を防ぐ（13.2） */
function withBusy(btn, label, fn){
  if(btn.disabled) return;
  var original = btn.textContent;
  btn.disabled = true;
  clear(btn);
  append(btn, h("span",{class:"spin","aria-hidden":"true"}));
  append(btn, label || "処理中…");
  setTimeout(function(){
    btn.disabled = false;
    clear(btn);
    append(btn, original);
    fn();
  }, 450);
}

function showApiError(res, whatSaved, nextStep){

/* ---- 8.5 案件管理（R1） --------------------------------------------- */
function orgOf(id){
  var o = DB.organizations.filter(function(x){ return x.id === id; })[0];
  return o || {id:null, name:"（企業未照合）", displayNo:"—", isCustomer:false, area:"—", industry:"—"};
}
function caseOf(id){ return DB.cases.filter(function(c){ return c.id === id; })[0]; }

/* 案件詳細と状態遷移（8.1 の許可遷移・必須入力・14.1 の楽観ロック） */
function openCase(caseId, focusTransition){
  var c = caseOf(caseId);
  if(!c) return;
  var org = orgOf(c.orgId);
  var allowed = CASE_TRANSITIONS[c.status] || [];
  var nextSelect = h("select",{id:"tr_next"});
  nextSelect.appendChild(h("option",{value:"",text:"（状態を変更しない）"}));
  allowed.forEach(function(s){ nextSelect.appendChild(h("option",{value:s,text:REG.caseStatus[s].label + "（" + s + "）"})); });
  var extra = h("div",{class:"form"});
  var inputs = {};
  function paintExtra(){
    clear(extra);
    inputs = {};
    var next = nextSelect.value;
    if(!next) return;
    requiredForCase(next).forEach(function(f){
      var input = h("input",{type:(f.key.indexOf("Due") > 0 ? "date" : "text"), id:"x_" + f.key,
        value:(f.key === "nextActionTitle" ? c.nextActionTitle : f.key === "nextActionDue" ? c.nextActionDue : f.key === "ownerRole" ? c.ownerRole : "")});
      inputs[f.key] = input;
      extra.appendChild(h("div",{class:"field"}, h("label",{for:"x_" + f.key}, f.label, h("span",{class:"req",text:"必須"})), input,
        h("span",{class:"err"}, h("span",{"aria-hidden":"true",text:"⚠"}), h("span",{class:"err-msg"}))));
    });
  }
  nextSelect.addEventListener("change", paintExtra);
  paintExtra();

  var conflictChk = h("input",{type:"checkbox", id:"conf_sim"});

  openModal(org.name + "｜" + c.title,[
    h("div",{class:"card-top"},
      h("span",null, statusBadge("caseStatus", c.status), " ", h("span",{class:"code",text:c.displayNo})),
      h("span",null, "version ", h("span",{class:"code",text:String(c.version)}))),
    h("dl",{class:"kv"},
      h("dt",{text:"企業（共通正本）"}), h("dd",null, org.name, " ", h("span",{class:"code",text:org.displayNo}),
        " ", org.isCustomer ? badge("顧客","ok","✔") : badge("見込み","muted")),
      h("dt",{text:"担当役割"}), h("dd",{text:c.ownerRole}),
      h("dt",{text:"次回行動"}), h("dd",null, c.nextActionTitle ? (c.nextActionTitle + "（期限 " + c.nextActionDue + "）") : unconfirmedFlag("次回行動が未設定")),
      h("dt",{text:"想定売上"}), h("dd",null, c.expectedRevenue ? [num(fmtMoney(c.expectedRevenue)), " ", confidenceBadge(c.revenueConfidence)] : unconfirmedFlag("想定売上・原価")),
      h("dt",{text:"停滞日数"}), h("dd",null, num(c.stalledDays + "日"), c.stalledDays >= REG.config.staleDays.value ? [" ", badge("停滞","warn","⚠")] : null),
      h("dt",{text:"元の受付"}), h("dd",null, h("span",{class:"code",text:c.intakeId}))),
    h("div",{class:"divider"}),
    h("h4",{style:"margin:0",text:"状態を変更する"}),
    h("p",{class:"card-desc",style:"margin:2px 0 8px",text:"許可された遷移のみ選べます。通常の更新APIで status を直接書き換えません。"}),
    h("div",{class:"field"}, h("label",{for:"tr_next",text:"次の状態"}), nextSelect),
    extra,
    h("div",{class:"note"},
      h("label",{style:"display:flex;gap:8px;align-items:center;font-size:12px"}, conflictChk,
        "競合デモ：送信前に他の利用者が更新した状態を再現する（CONFLICT_VERSION）")),
    allowed.length === 0 ? h("div",{class:"note warn"}, h("b",null,"終端状態です"),
      "この状態から戻す場合は、管理者用の再開ユースケース・理由・監査記録が必要です（8.1）。") : null
  ], [
    h("button",{class:"btn",text:"閉じる",onclick:closeModal}),
    h("button",{class:"btn primary",text:"変更を保存",onclick:function(ev){
      var next = nextSelect.value;
      if(!next){ toast("変更する状態を選んでください。"); return; }
      var payload = {caseId:c.id, next:next};
      Object.keys(inputs).forEach(function(k){ payload[k] = inputs[k].value.trim(); });
      var simulate = conflictChk.checked;
      withBusy(ev.currentTarget, "保存中…", function(){
        var res = Api.invoke({
          action:"case.transition", requestId:uuid(), permission:"case.transition",
          entityId:c.id, expectedVersion:c.version, currentVersion:simulate ? c.version + 1 : c.version,
          payload:payload,
          validate:function(){
            var e = {};
            requiredForCase(next).forEach(function(f){ if(!payload[f.key]) e[f.key] = f.label + "を入力してください。"; });
            if(allowed.indexOf(next) < 0) e.next = "許可されていない遷移です。";
            return e;
          },
          apply:function(){
            c.status = next; c.version += 1; c.stalledDays = 0;
            if(payload.nextActionTitle !== undefined) c.nextActionTitle = payload.nextActionTitle;
            if(payload.nextActionDue !== undefined) c.nextActionDue = payload.nextActionDue;
            if(payload.ownerRole) c.ownerRole = payload.ownerRole;
            if(next === "WON"){
              var dup = DB.customerizations.filter(function(x){ return x.caseId === c.id; })[0];
              if(!dup){
                DB.customerizations.unshift({id:"cus_01" + (DB.customerizations.length + 20), orgId:c.orgId, caseId:c.id,
                  status:"NOT_REQUESTED", requestedByRole:null, requestedAt:null, decidedByRole:null, reason:"", version:1});
              }
            }
            return {};
          }
        });
        if(!res.ok){
          if(res.error.code === "VALIDATION_ERROR"){
            Object.keys(res.error.fieldErrors).forEach(function(k){
              if(!inputs[k]) return;
              var wrap = inputs[k].parentNode;
              wrap.classList.add("invalid");
              wrap.querySelector(".err-msg").textContent = res.error.fieldErrors[k];
            });
            toast("入力内容を確認してください。", "err");
            return;
          }
          closeModal();
          showApiError(res, "なし（案件は変更されていません）",
            res.error.code === "CONFLICT_VERSION" ? "最新の案件を読み込み、相手の変更内容を確認してから再入力してください。" : null);
          return;
        }
        closeModal();
        toast(c.displayNo + " を「" + REG.caseStatus[next].label + "」へ変更しました。", "ok");
        render();
      });
    }})
  ]);
  if(focusTransition) nextSelect.focus();
}

              apply:function(){
                rec.status = next; rec.version += 1; rec.reason = reason.value.trim();

          rec.status === "PENDING" ? h("button",{class:"btn sm green",text:"承認",onclick:function(){ act(rec,"APPROVED"); }}) : null,

      return h("article",{class:"item" + (rec.status === "PENDING" ? " warn" : rec.status === "APPROVED" ? " ok" : "")},

          h("span",{text:rec.requestedAt ? "申請日：" + rec.requestedAt : "未申請"})),

        rec.reason ? h("p",{text:"理由：" + rec.reason}) : null,
        actions);

        h("b",null,"権限の分離（15.1）"),

    ];
  }

/* =====================================================================
 * 9. ルーティングと初期化（Ui_Router 相当）
 * ===================================================================== */
var NAV = [
  {group:"日次業務（R1）", items:["dashboard","intake","review","cases"]},
  {group:"顧客・売上（R1）", items:["organizations","customerization","followups","sales"]},
  {group:"拡張", items:["prospects","ai"]},
  {group:"前提・運用", items:["flow","gate0","audit"]}
];
function go(page){
  APP.page = page;
  APP.screenState = "READY";
  document.getElementById("state-select").value = "READY";
  render();
  window.scrollTo({top:0, behavior:"smooth"});
}
function setScreenState(s){
  APP.screenState = s;
  document.getElementById("state-select").value = s;
  render();
}
function focusRoleSelect(){
  var el = document.getElementById("role-select");
  el.focus();
  toast("役割を切り替えると、権限による表示と操作の違いを確認できます。");
}
function buildNav(){
  var nav = document.getElementById("nav");
  clear(nav);
  NAV.forEach(function(g){
    nav.appendChild(h("div",{class:"nav-group",text:g.group}));
    g.items.forEach(function(id){
      var p = PAGES[id];
      nav.appendChild(h("button",{
        type:"button",
        "aria-current":(APP.page === id ? "page" : null),
        onclick:function(){ go(id); }
      }, h("span",{text:p.title}), releaseChip(p.release)));
    });
  });
}
function render(){
  var page = PAGES[APP.page];
  document.getElementById("page-title").textContent = page.title;
  var meta = document.getElementById("page-meta");
  clear(meta);
  append(meta, "操作役割：" + REG.roles[APP.role].label + "　／　" + REG.roles[APP.role].note);
  buildNav();

  var view = document.getElementById("view");
  clear(view);

  var head = h("div",{class:"page-head"},
    h("div", null,
      h("h2", null, page.title, " ", releaseChip(page.release)),
      h("p",{text:page.desc})),
    h("div",{class:"head-actions"},
      h("button",{class:"btn",text:"最新を読み込む",onclick:function(ev){ withBusy(ev.currentTarget,"読込中…",function(){ toast("最新のサンプルデータを再取得しました。"); render(); }); }})));
  view.appendChild(head);

  /* 15.1 閲覧権限もサーバー側で確認する。ここでは役割による表示制御を再現 */
  if(page.view && !can(page.view)){
    view.appendChild(stateBlock("FORBIDDEN").node);
    return;
  }
  var st = APP.screenState === "READY" ? null : stateBlock(APP.screenState);
  if(st && st.mode === "replace"){
    view.appendChild(st.node);
    return;
  }
  if(st && st.mode === "banner"){
    st.node.style.marginBottom = "14px";
    view.appendChild(st.node);
  }
  append(view, page.render());
}
function initControls(){
  var roleSel = document.getElementById("role-select");
  Object.keys(REG.roles).forEach(function(r){
    roleSel.appendChild(h("option",{value:r, text:REG.roles[r].label, selected:(r === APP.role ? true : null)}));
  });
  roleSel.addEventListener("change", function(){
    APP.role = roleSel.value;
    toast("操作役割を「" + REG.roles[APP.role].label + "」へ切り替えました。");
    render();
  });
  var stateSel = document.getElementById("state-select");
  Object.keys(REG.screenStates).forEach(function(s){
    stateSel.appendChild(h("option",{value:s, text:REG.screenStates[s].label, selected:(s === APP.screenState ? true : null)}));
  });
  stateSel.addEventListener("change", function(){ APP.screenState = stateSel.value; render(); });

  /* 17.2 受入確認幅（360 / 390 / 768 / 1280）を画面上で確認できるようにする */
  function updateVp(){
    var w = document.documentElement.clientWidth, label;
    if(w < 390) label = "360px級（最小）";
    else if(w < 768) label = "390px級（スマートフォン）";
    else if(w < 1280) label = "768px級（タブレット）";
    else label = "1280px以上（PC）";
    var b = document.getElementById("vp-badge");
    clear(b);
    append(b, h("span",{"aria-hidden":"true",text:"↔"}));
    append(b, h("span",{class:"num",text:w + "px"}));
    append(b, h("span",{text:"／" + label}));
  }
  window.addEventListener("resize", updateVp);
  updateVp();
}
initControls();
render();
