<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2c4c">
  <title>CDP北海道｜顧客・案件・営業管理システム</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #f4f7fa; }
    body { font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; }
    .app-frame { width: 100%; height: 100%; border: 0; display: block; background: #f4f7fa; }
  </style>
</head>
<body>
  <iframe
    class="app-frame"
    title="CDP北海道 顧客・案件・営業管理システム"
    src="https://script.google.com/macros/s/AKfycbyJiJjTwa2S8dRa51gyVZBriaWAQYiHj3lFUz1-bjTumBNun5Hu36zQ2tr7KMoMlx8b/exec"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="strict-origin-when-cross-origin">
  </iframe>
  <script>
  (function () {
    var id = new URL(location.href).searchParams.get('intakeId');
    if (!id || !/^external-[a-zA-Z0-9-]{1,100}$/.test(id)) return;
    var key = 'cdp_form_intake_transfer_v2:' + id, envelope;
    try { envelope = JSON.parse(sessionStorage.getItem(key)); } catch (e) { return; }
    if (!envelope || envelope.requestId !== id) return;
    var frame = document.querySelector('.app-frame'), recipient = null;
    function belongsToFrame(source) {
      try {
        for (var n = 0; source && n < 5; n++) {
          if (source === frame.contentWindow) return true;
          if (source.parent === source) break;
          source = source.parent;
        }
      } catch (e) {}
      return false;
    }
    window.addEventListener('message', function (event) {
      if (!/^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(event.origin) ||
          !belongsToFrame(event.source)) return;
      if (event.data && event.data.type === 'cdp-intake-ready') {
        recipient = event.source;
        recipient.postMessage({ type:'cdp-intake-transfer', envelope:envelope }, event.origin);
      } else if (event.source === recipient && event.data && event.data.type === 'cdp-intake-saved' &&
                 event.data.requestId === id) {
        sessionStorage.removeItem(key);
        var url = new URL(location.href); url.searchParams.delete('intakeId');
        history.replaceState(null, '', url.href);
        envelope = null;
      }
    });
  })();
  </script>
  <noscript>JavaScriptを有効にして、<a href="https://script.google.com/macros/s/AKfycbyJiJjTwa2S8dRa51gyVZBriaWAQYiHj3lFUz1-bjTumBNun5Hu36zQ2tr7KMoMlx8b/exec">本番システム</a>を開いてください。</noscript>
</body>
</html>
